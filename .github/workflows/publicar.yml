# Publica site/ no GitHub Pages a cada push no main (a tarefa agendada do Claude grava site/data.json e faz push).
# Valida o data.json antes: se estiver fora do formato, o site anterior continua no ar.
# Requer, em Settings > Pages, a origem "GitHub Actions".
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python check_data.py site/data.json site/data-lula.json
      # Segredos, dados pessoais ou arquivos fora da lista barram a publicação
      - run: python check_privacy.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
